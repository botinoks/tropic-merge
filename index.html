 $('#rb').innerHTML='<p>Очки: <b>'+G.score+'</b> из '+goal+'</p><p>Подано: '+G.served+', ушло голодными: '+G.lost+'</p><p>Лучшее комбо: ×'+G.bc+'</p><p>Заработано: <b>'+coins+'</b> 🪙</p>'+x+(G.win?'':'<p>Не хватило очков. Улучши кухню и повтори смену.</p>');
 sGood();show('res')}
$('#rOk').onclick=()=>{
 if(S.fin)return menu();
 const st=ST[S.ch];say(G.spOk?st.win:st.lose,()=>{if(!G.win)return menu();if(S.ch<7){S.ch++;save();menu()}else{S.fin=1;chkAch(G);save();say(EPI,menu)}})};
/* ===== Menu, kitchen, book, diary ===== */
$('#bPlay').onclick=()=>{syncBgm();if(!S.fin&&S.seen<S.ch){S.seen=S.ch;save();say(ST[S.ch].intro,startShift)}else startShift()};
$('#bMute').onclick=()=>{S.mute=S.mute?0:1;save();menu()};
$('#bKit').onclick=kit;$('#kBack').onclick=menu;$('#dyBack').onclick=menu;$('#bDiary').onclick=diary;$('#bkBack').onclick=()=>{if(G&&G.on)show('game');else menu()};
function kit(){$('#coins').textContent=S.coins;
 $('#ups').innerHTML=UP.map(u=>{const l=S.up[u.id],cost=u.b*(l+1),mx=l>=u.m;return '<div class="box row"><div><b>'+u.n+'</b><p>'+u.d+'</p><span class="pip">'+'●'.repeat(l)+'○'.repeat(u.m-l)+'</span></div><button data-u="'+u.id+'" '+(mx||S.coins<cost?'disabled':'')+'>'+(mx?'Макс':cost+' 🪙')+'</button></div>'}).join('');
 $('#decl').innerHTML=DEC.map(d=>'<div class="box row"><div><b>'+d.e+' '+d.n+'</b><p>'+d.d+'</p></div><button data-d="'+d.id+'" '+(S.dec[d.id]||S.coins<d.c?'disabled':'')+'>'+(S.dec[d.id]?'Куплено':d.c+' 🪙')+'</button></div>').join('');show('kit')}
$('#ups').onclick=e=>{const b=e.target.closest('button');if(!b)return;const u=UP.find(x=>x.id===b.dataset.u),c=u.b*(S.up[u.id]+1);
 if(S.coins<c||S.up[u.id]>=u.m)return;S.coins-=c;S.up[u.id]++;save();sGood();hap('medium');kit()};
$('#decl').onclick=e=>{const b=e.target.closest('button');if(!b)return;const d=DEC.find(x=>x.id===b.dataset.d);
 if(S.dec[d.id]||S.coins<d.c)return;S.coins-=d.c;S.dec[d.id]=1;save();sGood();hap('medium');kit()};
function openBook(){const lvl=S.fin?7:S.ch;
 $('#bl').innerHTML=R.map(r=>r.ch<=lvl?'<div class="box"><b>'+r.n+'</b> <i>('+r.m+')</i><p>'+r.i.map(x=>I[x].e+' '+I[x].n).join(' · ')+'</p></div>':'<div class="box" style="opacity:.5">🔒 Откроется в главе '+(r.ch+1)+'</div>').join('');show('book')}
$('#bBook').onclick=openBook;
function diary(){const q=DQ[dayN()%3],dn=S.dl.last===dKey(),st=(dn||S.dl.last===String(dayN()-1))?S.dl.streak:0;
 $('#dyl').innerHTML='<div class="box"><b>📅 Задание дня</b><p>'+q[0]+'</p><p>'+(dn?'Выполнено ✅':'Награда: от 60 до 100 🪙')+'. Серия дней: '+st+'</p></div>'+ACH.map(a=>'<div class="box" style="'+(S.ach[a[0]]?'':'opacity:.55')+'"><b>'+(S.ach[a[0]]?'🏅 ':'🔒 ')+a[1]+'</b><p>'+a[2]+'</p></div>').join('');show('diary')}
/* ===== Boot ===== */
store.get('hyperbank').then(v=>{try{if(v){const o=JSON.parse(v);S=Object.assign(S,o);S.up=Object.assign({pat:0,time:0,hint:0,tip:0},o.up);S.dec=o.dec||{};S.ach=o.ach||{};S.dl=Object.assign({last:'',streak:0},o.dl)}}catch(e){}menu()});
</script></body></html>
