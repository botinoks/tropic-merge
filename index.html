<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Tropic Merge — Merge & Build</title>
<script type="text/javascript" src="https://me.kis.v2.scr.kaspersky-labs.com/FD126C42-EBFA-4E12-B309-BB3FDD723AC1/main.js?attr=r0jVt5hyiloM4fO1zdu8wp6jLbrw65qhHP6HKfwYQATkdPlPvxMpBKMhWxdIttgtQK9uOnGTnMgqetWb8qUPmZ6hO1SrCfHqGWLvf4y7xgFeDVo8XitkcJZt7dPfHSPEqgrwU8BOh07EdC59C81huCSLKc2LxNMYFxAhjNNtFbYfuF0nxRZGXcalLek6NswhdEXk0wgnIdiPKIfR6xLBtRZFUhiN47eH3HfanK74JED4-AncxRO91lpKcx0k2OcSet70iIhkhacK5RpKkd1HCReQXbriXxVnZuCVbfQDF0w-pPe1r6pxHeGwDTxPDJe0" charset="UTF-8"></script><script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --ocean:#3cc4bd;
  --ocean-deep:#269fa3;
  --sand:#f7e8c8;
  --sand-dark:#e6cf9f;
  --grass:#7bd876;
  --grass-dark:#58b959;
  --card:#ffffff;
  --ink:#263849;
  --muted:#677b8c;
  --gold:#ffb82e;
  --coral:#ff6f61;
  --energy:#29b6f6;
  --shadow:0 4px 0 rgba(38,56,73,.14);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none;touch-action:manipulation}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--ocean)}
body{
  height:100dvh;
  font-family:'Nunito',system-ui,-apple-system,sans-serif;
  color:var(--ink);
  display:flex;
  flex-direction:column;
  background:linear-gradient(180deg,#5ce1d6 0%,#3cc4bd 42%,#f5e6c4 43%,#ebd5a7 100%);
}

/* ===== TOP WIDGETS ===== */
#hud{
  flex:none;
  padding:var(--top-safe, 62px) 10px 5px;
  display:grid;
  grid-template-columns:1.25fr 1fr 1fr auto;
  gap:6px;
  z-index:10;
}
.pill{
  background:rgba(255,255,255,.94);
  border-radius:14px;
  padding:5px 9px;
  box-shadow:var(--shadow);
  display:flex;
  align-items:center;
  gap:6px;
  min-width:0;
}
.pill-ic{font-size:18px;flex:none}
.pill-col{display:flex;flex-direction:column;min-width:0;line-height:1.1}
.pill-val{font-weight:900;font-size:14px;white-space:nowrap}
.pill-sub{font-weight:700;font-size:10px;color:var(--muted);white-space:nowrap}
.pill-btn{
  background:#fff;
  border:none;
  border-radius:14px;
  padding:0 10px;
  font-size:18px;
  box-shadow:var(--shadow);
  cursor:pointer;
}
.pill-btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(38,56,73,.14)}

/* ===== ISLAND DIORAMA (TOP SCENE) ===== */
#island-wrap{
  position:relative;
  margin:0 10px;
  height:21dvh;
  min-height:130px;
  max-height:195px;
  border-radius:22px;
  overflow:hidden;
  background:radial-gradient(circle at 50% 35%,#79ece2 0%,#39c2bc 68%,#26a3a6 100%);
  box-shadow:0 6px 16px rgba(24,78,84,.22),inset 0 2px 0 rgba(255,255,255,.45);
  flex:none;
}
#island-svg{width:100%;height:100%;display:block}
.stage-badge{
  position:absolute;
  top:6px;left:8px;
  background:rgba(255,255,255,.9);
  padding:2px 8px;
  border-radius:9px;
  font-size:10px;
  font-weight:800;
  box-shadow:0 2px 5px rgba(0,0,0,.1);
  display:flex;align-items:center;gap:3px;
  pointer-events:none;
  z-index:2;
}
.build-cta{
  position:absolute;
  bottom:8px;right:10px;
  z-index:3;
  background:linear-gradient(180deg,#ffd24c,#ffad1f);
  color:#3c2500;
  border:2px solid #fff;
  border-radius:14px;
  padding:6px 12px;
  font-family:inherit;
  font-weight:900;
  font-size:12px;
  box-shadow:0 4px 10px rgba(0,0,0,.18);
  cursor:pointer;
  display:flex;align-items:center;gap:5px;
}
.build-cta.pulse{animation:pulseBtn 1.5s infinite}
@keyframes pulseBtn{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}

/* SVG Island Animations */
@keyframes wavePulse{0%,100%{transform:scale(1);opacity:.55}50%{transform:scale(1.035);opacity:.85}}
@keyframes sway{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
@keyframes spinSlow{to{transform:rotate(360deg)}}
@keyframes floatBoat{0%,100%{transform:translateY(0px)}50%{transform:translateY(-3px)}}
@keyframes smokeRise{0%{transform:translate(0,0) scale(.6);opacity:.75}100%{transform:translate(6px,-18px) scale(1.45);opacity:0}}
@keyframes gullFly{0%{transform:translateX(-40px) translateY(0)}50%{transform:translateX(190px) translateY(-9px)}100%{transform:translateX(420px) translateY(2px)}}
@keyframes popBuild{0%{transform:scale(0) translateY(15px);opacity:0}70%{transform:scale(1.14) translateY(-3px);opacity:1}100%{transform:scale(1) translateY(0);opacity:1}}
.wave-ring{transform-origin:200px 115px;animation:wavePulse 3.6s ease-in-out infinite}
.palm{transform-box:fill-box;transform-origin:bottom center;animation:sway 4s ease-in-out infinite}
.mill-blades{transform-box:fill-box;transform-origin:center;animation:spinSlow 9s linear infinite}
.boat-bob{animation:floatBoat 2.8s ease-in-out infinite}
.smoke{animation:smokeRise 2.4s ease-out infinite}
.gull{animation:gullFly 16s linear infinite}
.gull-2{animation:gullFly 21s linear infinite;animation-delay:-7s}
.gull-3{animation:gullFly 14s linear infinite;animation-delay:-11s}
.bld-pop{transform-box:fill-box;transform-origin:bottom center;animation:popBuild .55s cubic-bezier(.22,1.25,.36,1) forwards}

/* ===== ORDERS STRIP ===== */
#orders{
  display:flex;
  gap:8px;
  padding:6px 10px 4px;
  overflow-x:auto;
  overflow-y:hidden;
  flex:none;
  scrollbar-width:none;
  touch-action:pan-x;
  -webkit-overflow-scrolling:touch;
  cursor:grab;
}
#orders:active{cursor:grabbing}
#orders::-webkit-scrollbar{display:none}
#orders *{touch-action:pan-x}
.ord{
  background:var(--card);
  border-radius:16px;
  padding:7px 11px;
  box-shadow:var(--shadow);
  display:flex;
  align-items:center;
  gap:9px;
  flex:none;
  border:2px solid transparent;
  transition:.15s;
}
.ord.ready{border-color:#4cd964;background:#f2fff4}
.ord-items{display:flex;align-items:center;gap:5px}
.ord-it{
  position:relative;width:34px;height:34px;border-radius:10px;
  background:#f7f2e7;border:1.5px solid #e5d7bc;
  display:grid;place-items:center;flex:none;
}
.ord-it.has{background:#dcfce7;border-color:#22c55e}
.ord-it .chk{
  position:absolute;bottom:-3px;right:-3px;
  width:14px;height:14px;border-radius:50%;
  background:#22c55e;color:#fff;font-size:9px;font-weight:900;
  display:grid;place-items:center;border:1.5px solid #fff;
}
.chain-row{
  display:flex;align-items:center;gap:4px;overflow-x:auto;padding:4px 0;
}
.chain-step{
  flex:none;width:44px;border-radius:10px;background:#f7f2e7;
  padding:3px 2px;display:flex;flex-direction:column;align-items:center;
  font-size:8px;font-weight:800;text-align:center;border:1.5px solid transparent;
}
.chain-step.target{background:#fef3c7;border-color:#ffb82e}
.chain-step.owned{background:#dcfce7;border-color:#22c55e}
.ord-go{
  background:#22c55e;color:#fff;
  border:none;border-radius:11px;
  padding:7px 12px;
  font-family:inherit;font-weight:900;font-size:12px;
  cursor:pointer;
  box-shadow:0 3px 0 #15803d;
}
.ord-go:disabled{background:#cbd5e1;box-shadow:none;color:#64748b;cursor:default}
.ord-more{
  background:#f1f5f9;color:var(--ink);
  border:1.5px solid #cbd5e1;border-radius:11px;
  padding:7px 9px;
  font-family:inherit;font-weight:900;font-size:13px;letter-spacing:1px;line-height:1;
  cursor:pointer;
  box-shadow:0 2px 0 rgba(38,56,73,.12);
}
.ord-more:active{transform:translateY(2px);box-shadow:none}
.ord-rew{font-size:12px;font-weight:900;color:var(--ink);line-height:1.2}

/* ===== MERGE BOARD (5x6) ===== */
#board-area{
  flex:1 1 0%;
  padding:2px 10px 4px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  min-height:0;
  overflow:hidden;
}
#board{
  display:grid;
  grid-template-columns:repeat(6,minmax(0,1fr));
  grid-template-rows:repeat(5,minmax(0,1fr));
  gap:5px;
  width:100%;
  height:100%;
  max-height:100%;
  min-height:0;
  overflow:hidden;
  background:rgba(255,255,255,.38);
  padding:6px;
  border-radius:20px;
  box-shadow:inset 0 2px 6px rgba(133,106,58,.18);
}
.cell{
  position:relative;
  min-width:0;
  min-height:0;
  overflow:hidden;
  border-radius:13px;
  background:#fdf6e7;
  box-shadow:0 2px 0 rgba(168,140,86,.35);
  display:grid;
  place-items:center;
  transition:transform .12s,background .15s;
}
.cell.alt{background:#f5ebd4}
.cell.sel{
  background:#fff3bf;
  box-shadow:0 0 0 3px var(--gold),0 4px 8px rgba(0,0,0,.15);
  transform:scale(1.05);
  z-index:3;
}
.cell.match{
  box-shadow:0 0 0 2.5px #4cd964;
  background:#ebffef;
}
.cell.locked{
  background:#dfd3bc;
  box-shadow:inset 0 2px 5px rgba(85,68,42,.25);
}
.cell.locked::after{
  content:'';
  position:absolute;inset:0;
  border-radius:13px;
  background:repeating-linear-gradient(45deg,rgba(255,255,255,.35) 0 4px,transparent 4px 9px);
  pointer-events:none;
}
.cell.locked .item-svg{opacity:.58;filter:sepia(.35)}
.lvl-dot{
  position:absolute;
  top:2px;left:4px;
  font-size:9px;font-weight:900;
  color:rgba(38,56,73,.55);
  pointer-events:none;
}
.gen-ring{
  position:absolute;
  bottom:2px;right:3px;
  font-size:10px;
  background:var(--energy);
  color:#fff;
  border-radius:6px;
  padding:0 3px;
  font-weight:900;
  pointer-events:none;
}
.need-dot{
  position:absolute;
  top:2px;right:3px;
  width:8px;height:8px;
  border-radius:50%;
  background:#22c55e;
  border:1.5px solid #fff;
  pointer-events:none;
}
.item-svg{width:76%;height:76%;pointer-events:none;transition:transform .15s}
.merge-anim{animation:mergePop .28s cubic-bezier(.2,1.4,.4,1)}
@keyframes mergePop{0%{transform:scale(.4)}70%{transform:scale(1.18)}100%{transform:scale(1)}}

/* ===== INFO BAR ABOVE NAV ===== */
#sel-bar{
  flex:none;
  position:relative;
  z-index:12;
  margin:2px 10px 5px;
  background:rgba(255,255,255,.96);
  border-radius:14px;
  padding:6px 10px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  min-height:44px;
  font-size:12px;
  line-height:1.25;
  box-shadow:0 2px 6px rgba(38,56,73,.12);
}
#sel-txt{min-width:0;flex:1}
#sel-acts{flex:none}
#sel-bar button{
  border:none;border-radius:10px;
  padding:6px 10px;
  font-family:inherit;font-weight:800;font-size:11px;
  white-space:nowrap;
  cursor:pointer;
}
.btn-sell{background:#fee2e2;color:#b91c1c}
.btn-bag{background:#e0f2fe;color:#0369a1}
.btn-use{background:#dcfce7;color:#15803d}

/* ===== BOTTOM CONTROL MENU ===== */
#nav{
  flex:none;
  background:#ffffff;
  padding:6px 10px max(8px,env(safe-area-inset-bottom));
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:6px;
  border-radius:22px 22px 0 0;
  box-shadow:0 -4px 16px rgba(38,56,73,.12);
  z-index:10;
}
.nav-btn{
  background:#f4f7f9;
  border:none;
  border-radius:14px;
  padding:6px 4px;
  display:flex;flex-direction:column;align-items:center;gap:2px;
  font-family:inherit;font-weight:800;font-size:11px;color:var(--ink);
  cursor:pointer;
  position:relative;
}
.nav-btn *{pointer-events:none}
.nav-btn span.ic{font-size:19px;line-height:1}
.nav-btn.on{background:#dff7f4;color:#0f766e;box-shadow:inset 0 0 0 2px #3cc4bd}
.badge{
  position:absolute;top:3px;right:10px;
  background:var(--coral);color:#fff;
  font-size:9px;font-weight:900;
  padding:1px 5px;border-radius:99px;
}

/* ===== DRAWER / MODAL ===== */
#modal{
  display:none;
  position:fixed;inset:0;
  background:rgba(22,38,52,.45);
  backdrop-filter:blur(2px);
  z-index:30;
  align-items:flex-end;
}
#modal.on{display:flex}
.sheet{
  width:100%;
  max-height:78dvh;
  background:#fffdf8;
  border-radius:26px 26px 0 0;
  padding:14px 14px max(16px,env(safe-area-inset-bottom));
  display:flex;flex-direction:column;gap:10px;
  box-shadow:0 -8px 24px rgba(0,0,0,.2);
  animation:slideUp .22s ease-out;
}
@keyframes slideUp{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
.sheet-head{display:flex;justify-content:space-between;align-items:center}
.sheet-head h2{margin:0;font-size:19px}
.back-btn{background:#f1f5f9;color:var(--ink);border:2px solid #e2e8f0;border-radius:12px;padding:6px 14px;font-family:inherit;font-size:13px;font-weight:800;line-height:1.1;box-shadow:0 2px 0 rgba(38,56,73,.12);cursor:pointer;flex:none}
.back-btn:active{transform:translateY(2px);box-shadow:none}
.sheet-body{overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding-right:2px}
.card-row{
  background:#fff;
  border:2px solid #efe6d5;
  border-radius:16px;
  padding:10px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
}
.card-row.done{background:#f3faf4;border-color:#bbf7d0}
.act-btn{
  background:linear-gradient(180deg,#4ade80,#22c55e);
  color:#fff;border:none;border-radius:12px;
  padding:8px 12px;font-family:inherit;font-weight:900;font-size:12px;
  box-shadow:0 3px 0 #15803d;cursor:pointer;white-space:nowrap;
}
.act-btn:disabled{background:#cbd5e1;box-shadow:none;color:#64748b;cursor:default}

/* Backpack & Atlas Grids */
.bag-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.bag-slot{
  aspect-ratio:1;border-radius:16px;
  background:#f6efe0;border:2px dashed #d4c3a1;
  display:grid;place-items:center;position:relative;cursor:pointer;
}
.bag-slot.filled{border-style:solid;background:#fff;border-color:#3cc4bd}
.atlas-chain{background:#fff;border:2px solid #efe6d5;border-radius:16px;padding:8px}
.atlas-items{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:6px}
.atlas-cell{
  aspect-ratio:1;border-radius:10px;background:#f7f2e7;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:9px;font-weight:800;text-align:center;padding:2px;
}
.atlas-cell.unk{opacity:.4}

/* Floating feedback & drag ghost */
#fl{position:fixed;inset:0;pointer-events:none;z-index:40}
#fl div{
  position:fixed;font-weight:900;font-size:16px;
  pointer-events:none;animation:fltUp .85s forwards;
  text-shadow:0 2px 0 #fff,0 -1px 0 #fff;z-index:40;
}
@keyframes fltUp{to{transform:translateY(-54px);opacity:0}}
#ghost{
  position:fixed;width:54px;height:54px;pointer-events:none;
  z-index:50;transform:translate(-50%,-50%) scale(1.15);display:none;
}

/* ===== GUIDE TUTORIAL ===== */
#tut-box{
  display:none;
  margin:2px 10px 4px;
  background:linear-gradient(180deg,#fffef9,#fff6df);
  border:2px solid #ffb82e;
  border-radius:16px;
  padding:7px 10px;
  box-shadow:0 4px 12px rgba(38,56,73,.16);
  align-items:center;
  gap:9px;
  z-index:25;
  flex:none;
}
#tut-box.on{display:flex}
.tut-ava{
  width:38px;height:38px;border-radius:12px;
  background:#dff7f4;border:1.5px solid #3cc4bd;
  display:grid;place-items:center;flex:none;
}
.tut-mid{flex:1;min-width:0;line-height:1.25}
.tut-top{display:flex;align-items:center;gap:6px;margin-bottom:2px}
.tut-tag{font-size:10px;font-weight:900;color:#b45309;background:#fef3c7;padding:1px 6px;border-radius:6px}
.tut-msg{font-size:12px;font-weight:700;color:var(--ink)}
.tut-skip{
  background:#f1f5f9;color:var(--muted);border:none;border-radius:10px;
  padding:5px 8px;font-family:inherit;font-weight:800;font-size:11px;
  cursor:pointer;flex:none;
}
.tut-pulse{
  box-shadow:0 0 0 3px #ffb82e,0 0 14px rgba(255,184,46,.75) !important;
  animation:tutGlow 1.15s ease-in-out infinite;
  z-index:4;
}
@keyframes tutGlow{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
body.tut-active .tut-dim{opacity:.42;pointer-events:none !important}
body.tut-active #orders.tut-dim .ord-more{pointer-events:auto !important;opacity:1 !important}
</style>
</head>
<body>

<!-- TOP WIDGETS -->
<header id="hud">
  <div class="pill">
    <span class="pill-ic">⚡</span>
    <div class="pill-col">
      <span class="pill-val" id="h-en">50/50</span>
      <span class="pill-sub" id="h-ent">Полная</span>
    </div>
  </div>
  <div class="pill">
    <span class="pill-ic">🪙</span>
    <div class="pill-col">
      <span class="pill-val" id="h-coin">0</span>
      <span class="pill-sub">Монеты</span>
    </div>
  </div>
  <div class="pill">
    <span class="pill-ic">⭐</span>
    <div class="pill-col">
      <span class="pill-val" id="h-star">0</span>
      <span class="pill-sub" id="h-stg">Этап 1/5</span>
    </div>
  </div>
  <button class="pill-btn" id="btn-mute" title="Музыка">🔊</button>
</header>

<!-- ISLAND DIORAMA -->
<section id="island-wrap">
  <div class="stage-badge" id="stage-lbl">🏝 Песчаная отмель</div>
  <svg id="island-svg" viewBox="48 24 304 162" preserveAspectRatio="xMidYMid slice"></svg>
  <button class="build-cta" id="btn-build">🔨 Строить <span id="build-cnt"></span></button>
</section>

<!-- ORDERS STRIP -->
<section id="orders"></section>

<!-- GUIDE VILLAGER TUTORIAL -->
<section id="tut-box">
  <div class="tut-ava">
    <svg width="28" height="32" viewBox="-12 -20 24 26">
      <ellipse cx="0" cy="3" rx="6" ry="2.2" fill="rgba(0,0,0,.15)"/>
      <rect x="-4.5" y="-9" width="9" height="12" rx="4.2" fill="#ff7043"/>
      <circle cx="0" cy="-14" r="4.6" fill="#ffe0b2"/>
    </svg>
  </div>
  <div class="tut-mid">
    <div class="tut-top"><span class="tut-tag" id="tut-step">Обучение 1/5</span><b style="font-size:11px;color:#0f766e">Островитянин</b></div>
    <div class="tut-msg" id="tut-msg">Нажми на Лесную рощу ⚡, чтобы добыть ресурс!</div>
  </div>
  <button class="tut-skip" id="tut-skip">Пропустить</button>
</section>

<!-- MERGE BOARD -->
<main id="board-area">
  <div id="board"></div>
</main>

<!-- SELECTED ITEM ACTION BAR -->
<div id="sel-bar">
  <span id="sel-txt" style="color:var(--muted);font-weight:700">Нажми на рощу ⚡ или перетащи 2 одинаковых предмета</span>
  <div id="sel-acts" style="display:flex;gap:5px"></div>
</div>

<!-- BOTTOM CONTROL MENU -->
<nav id="nav">
  <button class="nav-btn on" data-tab="board"><span class="ic">🧩</span>Поле</button>
  <button class="nav-btn" data-tab="build"><span class="ic">🏗</span>Стройка<span class="badge" id="bdg-build" style="display:none">!</span></button>
  <button class="nav-btn" data-tab="bag"><span class="ic">🎒</span>Склад<span class="badge" id="bdg-bag">0/4</span></button>
  <button class="nav-btn" data-tab="atlas"><span class="ic">📖</span>Атлас</button>
</nav>

<!-- MODAL SHEET -->

function applySafeArea() {
  let top = 0;
  try {
    const sTop = (tg && tg.safeAreaInset && tg.safeAreaInset.top) || 0;
    const cTop = (tg && tg.contentSafeAreaInset && tg.contentSafeAreaInset.top) || 0;
    top = sTop + cTop;
  } catch (e) {}
  const inTg = !!(tg && tg.platform && tg.platform !== 'unknown');
  const finalTop = top > 0 ? Math.max(54, top - 22) : (inTg ? 62 : 8);
  document.documentElement.style.setProperty('--top-safe', finalTop + 'px');
}
applySafeArea();

    tg.ready(); tg.expand();

    try { localStorage.setItem(k, v); } catch (e) {}

const bgm = $('#bgm');

function tone(freq, dur, type, vol, delay) {
  if (S.mute) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime + (delay || 0);
    o.type = type || 'sine';
    o.frequency.value = freq;
    g.gain.setValueAtTime(vol || 0.1, t);
    g.gain.exponentialRampToValueAtTime(0.0008, t + (dur || 0.14));
    o.connect(g); g.connect(AC.destination);
    o.start(t); o.stop(t + (dur || 0.14));
  } catch (e) {}
}
const sfxTap = () => tone(520, 0.06, 'sine', 0.08);
const sSpawn = () => { tone(440, 0.07, 'triangle', 0.09); tone(660, 0.09, 'triangle', 0.08, 0.04); };
const sMerge = lvl => {
  const base = 392 * Math.pow(1.08, lvl);

  tone(base * 1.25, 0.16, 'triangle', 0.11, 0.06);
};
const sOrder = () => [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, 0.18, 'triangle', 0.11, i * 0.07));

function startProceduralMusic() {
  clearTimeout(musicTimer);
  if (S.mute || (bgmReady && !bgm.paused)) return;
  const scale = [523.25, 587.33, 659.25, 783.99, 880, 1046.5];
  const bass = [130.81, 174.61, 196.00, 164.81];
  if (noteStep % 4 === 0) tone(bass[(noteStep >> 2) % 4], 0.55, 'sine', 0.045);
  if (Math.random() < 0.65) {
    const f = scale[(noteStep * 3 + (Math.random() * 3 | 0)) % scale.length];
    tone(f, 0.28, 'sine', 0.032);
  }
  noteStep++;
  musicTimer = setTimeout(startProceduralMusic, 420);
}

function syncAudio() {
  bgm.volume = 0.4;

    bgm.play().then(() => clearTimeout(musicTimer)).catch(() => startProceduralMusic());
  } else {

}

function maxEn() {
  let m = 50;
  BUILDINGS.forEach(b => { if (S.built[b.id] && b.enCap) m += b.enCap; });
  return m;
}

/* 1 energy per 60 seconds (1 minute) */
const EN_STEP_MS = 60000;
function regenEnergy() {
  const cap = maxEn();
  const now = Date.now();
  if (S.en >= cap) { S.enTs = now; return; }
  const gained = Math.floor((now - S.enTs) / EN_STEP_MS);
  if (gained > 0) {
    S.en = Math.min(cap, S.en + gained);
    S.enTs += gained * EN_STEP_MS;
    if (S.en >= cap) S.enTs = now;
  }
}

/* ===== ORDERS GENERATOR ===== */
function makeOrder() {
  const st = S.stage;
  const availChains = ['wood'];
  if (S.built.quarry_b || st >= 2) availChains.push('stone');
  if (S.built.field || st >= 3) availChains.push('food');
  if (st >= 1) availChains.push('tool');

  const maxTier = Math.min(5, 2 + st);
  const count = st === 0 ? 1 : (Math.random() < 0.55 ? 2 : 1);
  const reqs = [];
  for (let i = 0; i < count; i++) {
    const ch = availChains[Math.random() * availChains.length | 0];
    const capL = Math.min(CHAINS[ch].items.length - 2, maxTier);
    const l = Math.max(1, Math.min(capL, 1 + (Math.random() * (st + 2) | 0)));
    reqs.push({ k: ch, l });
  }
  const value = reqs.reduce((a, r) => a + Math.round(Math.pow(2.15, r.l) * 8), 0);
  const stars = Math.max(1, Math.round(value / 24));
  const coins = Math.max(12, Math.round(value * (S.built.market ? 1.15 : 1)));
  return { id: Math.random().toString(36).slice(2, 8), reqs, stars, coins };
}

function refillOrders() {
  while (S.orders.length < 3) S.orders.push(makeOrder());
}

function updateVillagersDOM() {
  const layer = $('#villagers-layer');
  if (!layer) return;
  const t = performance.now() / 140;
  layer.innerHTML = VILLAGERS.map((v, i) => {
    const bob = v.wait > 0 ? 0 : Math.abs(Math.sin(t + i * 2)) * 2.2;
    return `<g transform="translate(${v.x.toFixed(1)},${(v.y - bob).toFixed(1)})">
      <ellipse cx="0" cy="2" rx="3.5" ry="1.5" fill="rgba(0,0,0,.2)"/>
      <rect x="-2.6" y="-6" width="5.2" height="7" rx="2.5" fill="${v.col}"/>
      <circle cx="0" cy="-9" r="2.7" fill="#ffe0b2"/>
    </g>`;
  }).join('');
}

function stepVillagers() {
  const targets = getWalkTargets();
  VILLAGERS.forEach(v => {
    if (v.wait > 0) { v.wait--; return; }
    const dx = v.tx - v.x, dy = v.ty - v.y;
    const dist = Math.hypot(dx, dy);
    if (dist < 2) {
      v.wait = 45 + (Math.random() * 60 | 0);
      const next = targets[Math.random() * targets.length | 0];
      v.tx = next.x + (Math.random() * 14 - 7);
      v.ty = next.y + (Math.random() * 8 - 4);
    } else {
      v.x += (dx / dist) * v.spd;
      v.y += (dy / dist) * v.spd;
    }
  });
  updateVillagersDOM();
  requestAnimationFrame(stepVillagers);
}

/* ===== BOARD INTERACTION ===== */
let selIdx = -1;
let dragIdx = -1;

function flt(txt, x, y, col) {
  const d = document.createElement('div');
  d.textContent = txt;
  d.style.cssText = `left:${x}px;top:${y}px;color:${col || '#263849'}`;
  $('#fl').appendChild(d);
  setTimeout(() => d.remove(), 850);
}

function getBoardNeedSet() {
  const needed = new Set();
  const poolUsed = new Set();
  S.orders.forEach(o => {
    if (!o || !Array.isArray(o.reqs)) return;
    o.reqs.forEach(r => {
      const idx = S.board.findIndex((c, i) => !poolUsed.has(i) && c && c.t === 'item' && !c.lock && c.k === r.k && c.l === r.l);
      if (idx >= 0) {
        poolUsed.add(idx);
        needed.add(idx);
      }
    });
  });
  return needed;
}

function renderBoard(popIndex = -1) {
  const bEl = $('#board');
  const neededCells = getBoardNeedSet();
  bEl.innerHTML = S.board.map((c, i) => {
    const alt = ((Math.floor(i / 6) + (i % 6)) % 2) ? ' alt' : '';
    const sel = i === selIdx ? ' sel' : '';
    const lock = c && c.lock ? ' locked' : '';
    let match = '';
    if (selIdx >= 0 && selIdx !== i && c && !lock) {
      const sc = S.board[selIdx];
      if (sc && sc.t === 'item' && c.t === 'item' && sc.k === c.k && sc.l === c.l && sc.l < CHAINS[c.k].items.length - 1) {
        match = ' match';
      }
    } else if (selIdx >= 0 && selIdx !== i && c && c.lock) {
      const sc = S.board[selIdx];
      if (sc && sc.t === 'item' && sc.k === c.k && sc.l === c.l) match = ' match';
    }

    let inner = '';
    if (c) {
      const anim = i === popIndex ? ' merge-anim' : '';
      inner += `<div class="${anim}" style="width:100%;height:100%;display:grid;place-items:center">${itemSVG(c.k, c.l)}</div>`;
      if (c.t === 'item') {
        inner += `<span class="lvl-dot">${c.l + 1}</span>`;
        if (!c.lock && neededCells.has(i)) inner += `<span class="need-dot"></span>`;
      } else {
        inner += `<span class="gen-ring">⚡</span>`;
      }
    }
    return `<div class="cell${alt}${sel}${match}${lock}" data-i="${i}">${inner}</div>`;
  }).join('');
  renderSelBar();
}

function renderSelBar() {
  const txt = $('#sel-txt'), acts = $('#sel-acts');
  acts.innerHTML = '';
  if (selIdx < 0 || !S.board[selIdx]) {
    txt.textContent = 'Нажми на рощу ⚡ для добычи или соединяй пары';
    return;
  }
  const c = S.board[selIdx];
  if (c.t === 'gen') {
    const g = GENS[c.k];
    const lvl = S.genLvl[c.k] || 1;
    txt.innerHTML = `<b>${g.name}</b> (Ур. ${lvl}) — нажми ещё раз (-1⚡)`;
    const btn = document.createElement('button');
    btn.className = 'btn-use';
    btn.textContent = 'Добыть ⚡';
    btn.onclick = () => triggerGen(selIdx);
    acts.appendChild(btn);
    return;
  }
  const ch = CHAINS[c.k];
  const name = ch.items[c.l];
  if (c.lock) {
    txt.innerHTML = `🔒 <b>${name}</b> (Ур. ${c.l + 1}) — объедини с таким же!`;
    return;
  }
  txt.innerHTML = `<b>${name}</b> (${ch.name} • Ур. ${c.l + 1}/${ch.items.length})`;

  if (c.k === 'coin' && c.l === 3) {
    const op = document.createElement('button');
    op.className = 'btn-use';
    op.textContent = 'Открыть 🎁';
    op.onclick = () => openChest(selIdx);
    acts.appendChild(op);
  } else if (c.k === 'coin') {
    const col = document.createElement('button');
    col.className = 'btn-use';
    const val = [3, 10, 30][c.l] || 3;
    col.textContent = `Забрать +${val}🪙`;
    col.onclick = () => collectCoin(selIdx, val);
    acts.appendChild(col);
  }

  if (isTutActive()) return;
  if (S.bag.length < 4) {
    const bg = document.createElement('button');
    bg.className = 'btn-bag';
    bg.textContent = 'В склад 🎒';
    bg.onclick = () => moveToBag(selIdx);
    acts.appendChild(bg);
  }

  const sellVal = Math.max(1, Math.pow(2, c.l));
  const sb = document.createElement('button');
  sb.className = 'btn-sell';
  sb.textContent = `Продать +${sellVal}🪙`;
  sb.onclick = () => {
    S.coins += sellVal;
    S.board[selIdx] = null;
    selIdx = -1;
    sfxTap(); hap('light');
    updateAll();
  };
  acts.appendChild(sb);
}

function collectCoin(idx, val) {
  const el = document.querySelector(`.cell[data-i="${idx}"]`);
  const r = el ? el.getBoundingClientRect() : { left: 150, top: 300 };
  S.coins += val;
  S.board[idx] = null;
  selIdx = -1;
  sOrder(); hap('medium');
  flt(`+${val} 🪙`, r.left + 10, r.top, '#d97706');
  updateAll();
}

function openChest(idx) {
  const el = document.querySelector(`.cell[data-i="${idx}"]`);
  const r = el ? el.getBoundingClientRect() : { left: 150, top: 300 };
  S.coins += 75;
  S.en = Math.min(maxEn() + 15, S.en + 12);
  S.board[idx] = null;
  selIdx = -1;
  sOrder(); note('success');
  flt('+75 🪙 +12 ⚡', r.left - 10, r.top, '#0288d1');
  updateAll();
}

function moveToBag(idx) {
  if (S.bag.length >= 4 || !S.board[idx] || S.board[idx].lock) return;
  S.bag.push(S.board[idx]);
  S.board[idx] = null;
  selIdx = -1;
  sfxTap(); hap('light');
  updateAll();
}

function triggerGen(idx) {
  const c = S.board[idx];
  if (!c || c.t !== 'gen') return;
  regenEnergy();
  const el = document.querySelector(`.cell[data-i="${idx}"]`);
  const rect = el ? el.getBoundingClientRect() : { left: 150, top: 300 };

  if (S.en <= 0) {
    flt('Мало энергии ⚡', rect.left - 15, rect.top, '#ef4444');
    note('error');
    return;
  }
  const empty = [];
  S.board.forEach((cell, i) => { if (!cell) empty.push(i); });
  if (!empty.length) {
    flt('Нет места на поле!', rect.left - 25, rect.top, '#ef4444');
    note('error');
    return;
  }

  S.en--;
  if (S.en === maxEn() - 1) S.enTs = Date.now();

  const g = GENS[c.k];
  const gLvl = S.genLvl[c.k] || 1;
  const isSub = Math.random() < g.subChance;
  const chainKey = isSub ? g.sub : g.chain;
  const tier2Chance = (gLvl - 1) * 0.12;
  const lvl = (!isSub && Math.random() < tier2Chance) ? 1 : 0;

  empty.sort((a, b) => {
    const da = Math.hypot((a % 6) - (idx % 6), Math.floor(a / 6) - Math.floor(idx / 6));
    const db = Math.hypot((b % 6) - (idx % 6), Math.floor(b / 6) - Math.floor(idx / 6));
    return da - db;
  });
  const targetIdx = empty[0];
  S.board[targetIdx] = { t: 'item', k: chainKey, l: lvl };
  S.seen[chainKey][lvl] = 1;
  if (S.tut === 0) advanceTut(0);
  sSpawn(); hap('light');
  updateAll(targetIdx);
}

function handleCellPair(from, to) {
  if (from === to) return;
  const A = S.board[from], B = S.board[to];
  if (!A || A.lock) return;

  if (!B) {
    S.board[to] = A;
    S.board[from] = null;
    selIdx = to;
    sfxTap();
    updateAll();
    return;
  }

  if (A.t === 'item' && B.t === 'item' && A.k === B.k && A.l === B.l) {
    if (S.tut >= 0 && S.tut <= 3 && A.k === 'wood' && A.l >= 2) {
      const el = document.querySelector(`.cell[data-i="${to}"]`);
      const r = el ? el.getBoundingClientRect() : { left: 140, top: 300 };
      flt('Сначала сдай заказ сверху! 👆', Math.max(20, r.left - 40), r.top - 10, '#d97706');
      note('warning');
      selIdx = to;
      renderBoard();
      return;
    }
    const maxL = CHAINS[A.k].items.length - 1;
    if (A.l >= maxL) {
      selIdx = to;
      renderBoard();
      return;
    }
    const nextL = A.l + 1;
    S.board[to] = { t: 'item', k: A.k, l: nextL };
    S.board[from] = null;
    S.seen[A.k][nextL] = 1;
    selIdx = to;

    const el = document.querySelector(`.cell[data-i="${to}"]`);
    const r = el ? el.getBoundingClientRect() : { left: 160, top: 300 };
    sMerge(nextL); hap('medium');

    if (nextL >= 3 && Math.random() < 0.35) {
      const emp = S.board.findIndex(x => !x);
      if (emp >= 0) {
        S.board[emp] = { t: 'item', k: 'coin', l: 0 };
        S.seen.coin[0] = 1;
      }
    }
    if (B.lock) {
      if (S.tut === 2) advanceTut(2);
      flt('Клетка открыта! ✨', r.left - 20, r.top - 10, '#16a34a');
    } else {
      if (S.tut === 1) advanceTut(1);
      flt(CHAINS[A.k].items[nextL], r.left - 10, r.top - 8, '#263849');
    }
    updateAll(to);
    return;
  }

  if (!B.lock) {
    S.board[to] = A;
    S.board[from] = B;
    selIdx = to;
    sfxTap();
    updateAll();
  } else {
    selIdx = to;
    renderBoard();
  }
}

/* Pointer Drag & Tap handling on board */
const boardEl = $('#board');
const ghostEl = $('#ghost');
let ptrDownIdx = -1, isDragging = false, startX = 0, startY = 0;

boardEl.addEventListener('pointerdown', e => {
  const cell = e.target.closest('.cell');
  if (!cell) return;
  const idx = +cell.dataset.i;
  ptrDownIdx = idx;
  isDragging = false;
  startX = e.clientX; startY = e.clientY;
});

window.addEventListener('pointermove', e => {
  if (ptrDownIdx < 0) return;
  const c = S.board[ptrDownIdx];
  if (!c || c.lock) return;
  if (!isDragging && Math.hypot(e.clientX - startX, e.clientY - startY) > 10) {
    isDragging = true;
    dragIdx = ptrDownIdx;
    selIdx = ptrDownIdx;
    ghostEl.innerHTML = itemSVG(c.k, c.l);
    ghostEl.style.display = 'block';
    renderBoard();
  }
  if (isDragging) {
    ghostEl.style.left = e.clientX + 'px';
    ghostEl.style.top = e.clientY + 'px';
  }
});

window.addEventListener('pointerup', e => {
  if (ptrDownIdx < 0) return;
  if (isDragging) {
    ghostEl.style.display = 'none';
    const el = document.elementFromPoint(e.clientX, e.clientY);
    const targetCell = el && el.closest('.cell');
    if (targetCell) {
      handleCellPair(dragIdx, +targetCell.dataset.i);
    }
  } else {
    const idx = ptrDownIdx;
    const c = S.board[idx];
    if (selIdx === idx) {
      if (c && c.t === 'gen') triggerGen(idx);
      else if (c && c.t === 'item' && !c.lock && c.k === 'coin' && c.l === 3) openChest(idx);
      else if (c && c.t === 'item' && !c.lock && c.k === 'coin') collectCoin(idx, [3, 10, 30][c.l]);
      else { selIdx = -1; renderBoard(); }
    } else if (selIdx >= 0 && S.board[selIdx] && !S.board[selIdx].lock && c && c.t === 'item' && S.board[selIdx].t === 'item' && S.board[selIdx].k === c.k && S.board[selIdx].l === c.l) {
      handleCellPair(selIdx, idx);
    } else {
      selIdx = c ? idx : -1;
      sfxTap();
      renderBoard();
    }
  }
  ptrDownIdx = -1;
  dragIdx = -1;
  isDragging = false;
});

/* ===== ORDERS RENDER, TOUCH SWIPE & FULFILL ===== */
function checkOrderReady(ord) {
  if (!ord || !Array.isArray(ord.reqs) || ord.reqs.length === 0) return [];
  const used = new Set();
  return ord.reqs.map(r => {
    const idx = S.board.findIndex((c, i) => !used.has(i) && c && c.t === 'item' && !c.lock && c.k === r.k && c.l === r.l);
    if (idx >= 0) { used.add(idx); return idx; }
    return -1;
  });
}

function isOrderComplete(ord, matches) {
  if (!ord || !Array.isArray(ord.reqs) || ord.reqs.length === 0) return false;
  if (!Array.isArray(matches) || matches.length !== ord.reqs.length) return false;
  const unique = new Set();
  for (let ri = 0; ri < ord.reqs.length; ri++) {
    const idx = matches[ri];
    const req = ord.reqs[ri];
    if (typeof idx !== 'number' || idx < 0 || idx >= S.board.length || unique.has(idx)) return false;
    const cell = S.board[idx];
    if (!cell || cell.t !== 'item' || cell.lock || cell.k !== req.k || cell.l !== req.l) return false;
    unique.add(idx);
  }
  return true;
}

function renderOrders() {
  const wrap = $('#orders');
  wrap.innerHTML = S.orders.map((o, oi) => {
    const matches = checkOrderReady(o);
    const ready = isOrderComplete(o, matches);
    const itemsHtml = (o.reqs || []).map((r, ri) => {
      const has = matches[ri] >= 0;
      const nm = (CHAINS[r.k] && CHAINS[r.k].items[r.l]) || '';
      return `<div class="ord-it${has ? ' has' : ''}" title="${nm} (Ур. ${r.l + 1})">
        <div style="width:26px;height:26px">${itemSVG(r.k, r.l)}</div>
        ${has ? '<span class="chk">✓</span>' : ''}
      </div>`;
    }).join('');
    return `<div class="ord${ready ? ' ready' : ''}">
      <div class="ord-items">${itemsHtml}</div>
      <div class="ord-rew">+${o.coins}🪙<br>+${o.stars}⭐</div>
      <button class="ord-go" data-oi="${oi}" ${ready ? '' : 'disabled'}>Сдать</button>
      <button class="ord-more" data-oi="${oi}" title="Условия заказа">•••</button>
    </div>`;
  }).join('');
}

/* Smooth touch & mouse horizontal drag-scroll for orders strip */
const ordersEl = $('#orders');
let ordDrag = false, ordDragged = false, ordStartX = 0, ordScrollLeft = 0;

ordersEl.addEventListener('pointerdown', e => {
  if (e.pointerType === 'touch') return; // native touch scroll handles touch
  ordDrag = true;
  ordDragged = false;
  ordStartX = e.clientX;
  ordScrollLeft = ordersEl.scrollLeft;
});
window.addEventListener('pointermove', e => {

  if (Math.abs(dx) > 5) ordDragged = true;
  ordersEl.scrollLeft = ordScrollLeft - dx;
});
window.addEventListener('pointerup', () => { ordDrag = false; });

let inspectOrder = null;
ordersEl.onclick = e => {

$('#m-body').onclick = e => {
  const bBtn = e.target.closest('[data-bld]');
  if (bBtn) {
    const b = BUILDINGS.find(x => x.id === bBtn.dataset.bld);
    if (!b || S.built[b.id] || S.stars < b.stars || S.coins < b.coins) return;
    S.stars -= b.stars;
    S.coins -= b.coins;
    S.built[b.id] = 1;
    S.lastPop = b.id;
    if (S.tut === 4) advanceTut(4);

    if (b.grantGen) {
      const emp = S.board.findIndex(x => !x);
      if (emp >= 0) S.board[emp] = { t: 'gen', k: b.grantGen, l: 1 };
      else S.bag.push({ t: 'gen', k: b.grantGen, l: 1 });
    }

    const stBlds = STAGES[S.stage].blds;
    if (stBlds.every(id => S.built[id]) && S.stage < STAGES.length - 1) {
      S.stage++;
      S.en = maxEn();
      refillOrders();
    }

    sBuild(); note('success');
    openModal('board');
    updateAll();
    setTimeout(() => { S.lastPop = ''; }, 900);
    return;
  }

  const gBtn = e.target.closest('[data-upgen]');
  if (gBtn) {
    const gk = gBtn.dataset.upgen;
    const lvl = S.genLvl[gk] || 1;
    const cost = lvl === 1 ? 180 : 420;
    if (lvl >= 3 || S.coins < cost) return;
    S.coins -= cost;
    S.genLvl[gk] = lvl + 1;
    sBuild(); hap('medium');
    renderModal();
    updateHud();
    save();
    return;
  }

  const bagSlot = e.target.closest('[data-bi]');
  if (bagSlot) {
    const bi = +bagSlot.dataset.bi;
    const emp = S.board.findIndex(x => !x);
    if (emp < 0) { flt('Нет места на поле!', 120, 260, '#ef4444'); return; }
    S.board[emp] = S.bag[bi];
    S.bag.splice(bi, 1);
    sfxTap(); hap('light');
    renderModal();
    updateAll(emp);
    return;
  }

  if (e.target.id === 'tog-snd') {
    S.mute = S.mute ? 0 : 1;
    syncAudio();
    renderModal();
    save();
  }
  if (e.target.id === 'modal-ord-go' && inspectOrder && S.orders[inspectOrder.oi]) {
    const oi = inspectOrder.oi;
    const ord = S.orders[oi];
    const matches = checkOrderReady(ord);
    if (!isOrderComplete(ord, matches)) return;
    matches.forEach(idx => { S.board[idx] = null; });
    S.coins += ord.coins;
    S.stars += ord.stars;
    selIdx = -1;
    S.orders.splice(oi, 1);
    if (S.tut === 3) advanceTut(3);
    refillOrders();
    sOrder(); note('success');
    flt(`+${ord.coins}🪙 +${ord.stars}⭐`, 120, 220, '#16a34a');
    openModal('board');
    updateAll();
    return;
  }
  if (e.target.id === 'rst-game') {
    localStorage.removeItem(SAVE_KEY);
    location.reload();
  }
};

$('#m-body').onchange = e => {
  if (e.target.id === 'pick-mp3' && e.target.files[0]) {
    if (customBlobUrl) URL.revokeObjectURL(customBlobUrl);
    customBlobUrl = URL.createObjectURL(e.target.files[0]);
    bgm.src = customBlobUrl;
    bgmReady = true;
    S.mute = 0;
    syncAudio();
    flt('Трек загружен! 🎵', 120, 220, '#0f766e');
  }
};

$('#m-close').onclick = () => openModal('board');
$('#modal').onclick = e => { if (e.target.id === 'modal') openModal('board'); };
$('#btn-build').onclick = () => openModal('build');
$('#btn-mute').onclick = () => openModal('audio');
$('#tut-skip').onclick = () => { S.tut = 5; sfxTap(); updateAll(); };
$('#nav').addEventListener('click', e => {
  const btn = e.target.closest('.nav-btn');
  if (btn) openModal(btn.dataset.tab);
});

/* ===== INTERACTIVE VILLAGER TUTORIAL ===== */
const TUT_STEPS = [
  { tag: 'Шаг 1/5 • Добыча', msg: 'Нажми на <b>Лесную рощу ⚡</b> в центре поля, чтобы добыть ресурс!' },
  { tag: 'Шаг 2/5 • Слияние', msg: 'Перетащи <b>Ветку</b> на другую такую же <b>Ветку</b>, чтобы получить Бревно.' },
  { tag: 'Шаг 3/5 • Пыль', msg: 'Перетащи свободное <b>Бревно</b> на запылённое <b>Бревно</b>, чтобы открыть клетку!' },
  { tag: 'Шаг 4/5 • Заказ', msg: 'Отлично! Нажми <b>Сдать</b> на первом заказе сверху за монеты и звёзды.' },
  { tag: 'Шаг 5/5 • Стройка', msg: 'Нажми <b>🔨 Строить</b> и возведи <b>Костёр путешественника</b>!' }
];

function isTutActive() {
  return typeof S.tut === 'number' && S.tut >= 0 && S.tut < 5;
}

function advanceTut(stepCompleted) {
  if (S.tut !== stepCompleted) return;
  S.tut++;
  if (S.tut >= 5) {
    S.tut = 5;
    note('success');
    flt('Обучение завершено! 🏝', 95, 240, '#0f766e');
  }
}

function renderTutorial() {
  const box = $('#tut-box');
  const active = isTutActive();
  document.body.classList.toggle('tut-active', active);
  box.classList.toggle('on', active);

  document.querySelectorAll('.tut-pulse').forEach(el => el.classList.remove('tut-pulse'));
  document.querySelectorAll('.tut-dim').forEach(el => el.classList.remove('tut-dim'));

  if (!active) return;

  const st = TUT_STEPS[S.tut];
  $('#tut-step').textContent = st.tag;
  $('#tut-msg').innerHTML = st.msg;

  $('#btn-mute').classList.add('tut-dim');
  if (S.tut < 4) {
    $('#btn-build').classList.add('tut-dim');
    $('#nav').classList.add('tut-dim');
  } else {
    $('#btn-build').classList.add('tut-pulse');
    document.querySelectorAll('.nav-btn').forEach(b => {
      if (b.dataset.tab === 'build') b.classList.add('tut-pulse');
      else b.classList.add('tut-dim');
    });
  }

  if (S.tut !== 3) {
    $('#orders').classList.add('tut-dim');
  } else {
    const firstGo = $('#orders .ord-go');
    if (firstGo) firstGo.classList.add('tut-pulse');
  }

  if (S.tut === 0) {
    const gi = S.board.findIndex(c => c && c.t === 'gen');
    const gEl = gi >= 0 && document.querySelector(`.cell[data-i="${gi}"]`);
    if (gEl) gEl.classList.add('tut-pulse');
  } else if (S.tut === 1) {
    S.board.forEach((c, i) => {
      if (c && c.t === 'item' && !c.lock && c.k === 'wood' && c.l === 0) {
        const el = document.querySelector(`.cell[data-i="${i}"]`);
        if (el) el.classList.add('tut-pulse');
      }
    });
  } else if (S.tut === 2) {
    S.board.forEach((c, i) => {
      if (c && c.t === 'item' && c.k === 'wood' && c.l === 1) {
        const el = document.querySelector(`.cell[data-i="${i}"]`);
        if (el) el.classList.add('tut-pulse');
      }
    });
  }
}

/* ===== HUD & LOOP ===== */
function updateHud() {
  regenEnergy();
  const cap = maxEn();
  $('#h-en').textContent = `${S.en}/${cap}`;
  if (S.en >= cap) {
    $('#h-ent').textContent = 'Максимум';
  } else {
    const left = Math.max(1, Math.ceil((EN_STEP_MS - ((Date.now() - S.enTs) % EN_STEP_MS)) / 1000));
    $('#h-ent').textContent = `+1 через ${left}с`;
  }
  $('#h-coin').textContent = S.coins;
  $('#h-star').textContent = S.stars;
  $('#h-stg').textContent = `Этап ${S.stage + 1}/5`;
  $('#stage-lbl').textContent = `🏝 ${STAGES[S.stage].name}`;
  $('#bdg-bag').textContent = `${S.bag.length}/4`;

  const readyBlds = BUILDINGS.filter(b => b.st <= S.stage && !S.built[b.id] && S.stars >= b.stars && S.coins >= b.coins).length;
  $('#bdg-build').style.display = readyBlds ? 'inline-block' : 'none';
  $('#bdg-build').textContent = readyBlds;
  $('#build-cnt').textContent = readyBlds ? `(${readyBlds})` : '';
  $('#btn-build').classList.toggle('pulse', readyBlds > 0);
}

function updateAll(popIndex = -1) {
  updateHud();
  renderIsland();
  renderOrders();
  renderBoard(popIndex);
  renderTutorial();
  if (curTab !== 'board') renderModal();
  save();
}

/* ===== BOOT ===== */
store.get(SAVE_KEY).then(raw => {
  try {
    if (raw) {
      const o = JSON.parse(raw);
      S = Object.assign(S, o);
      if (typeof o.tut !== 'number') S.tut = 5;
      S.built = o.built || {};
      S.genLvl = Object.assign({ g_wood: 1, g_stone: 1, g_food: 1 }, o.genLvl);
      S.bag = o.bag || [];
      S.orders = (o.orders || []).filter(ord => ord && Array.isArray(ord.reqs) && ord.reqs.length > 0);
    }
  } catch (e) {}
  if (!S.board || S.board.length !== 30) initNewBoard();
  refillOrders();
  updateAll();
  setInterval(updateHud, 1000);
  requestAnimationFrame(stepVillagers);
});
</script>
</body>
